[project]
name = "company-entity-resolution"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]
spark = ["pyspark>=4.0", "pyarrow>=11"]  # needs Java 17/21; tests skip if absent

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
